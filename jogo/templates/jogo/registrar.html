{% extends 'jogo/base.html' %}
{% block content %}
<div style="max-width: 450px; margin: 0 auto; text-align: left;">
    <h2 style="text-align: center;">🎮 CRIAR CONTA</h2>
    
    <div style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        <form method="POST">
            {% csrf_token %}
            
            <!-- CAMPO USUÁRIO -->
            <div style="margin-bottom: 15px;">
                <label for="id_username" style="display: block; margin-bottom: 5px; font-weight: bold;">Usuário:</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <!-- CAMPO E-MAIL -->
            <div style="margin-bottom: 15px;">
                <label for="id_email" style="display: block; margin-bottom: 5px; font-weight: bold;">E-mail:</label>
                <input type="email" name="email" autocomplete="email" required id="id_email" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <!-- CAMPO SENHA -->
            <div style="margin-bottom: 20px;">
                <label for="id_password1" style="display: block; margin-bottom: 5px; font-weight: bold;">Senha:</label>
                <input type="password" name="password1" autocomplete="new-password" required id="id_password1" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <!-- BOTÃO CADASTRAR -->
            <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                Cadastrar
            </button>
        </form>

        <!-- BOTÃO VOLTAR -->
        <div style="margin-bottom: 15px;">
            <a href="javascript:history.back()" style="text-decoration: none; color: #007bff; font-weight: bold; font-size: 14px;">
                &larr; Voltar
            </a>
        </div>
    </div>
</div>
{% endblock %}
