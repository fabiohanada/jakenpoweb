{% extends 'jogo/base.html' %}
{% block content %}
<div style="max-width: 450px; margin: 0 auto; text-align: left;">
    
    <div style="margin-bottom: 15px;">
        <a href="javascript:history.back()" style="text-decoration: none; color: #007bff; font-weight: bold; font-size: 14px;">&larr; Voltar</a>
    </div>

    <h2 style="text-align: center;">🔒 CRIAR NOVA SENHA</h2>
    
    <div style="background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                
                <div style="margin-bottom: 15px;">
                    <label for="id_new_password1" style="display: block; margin-bottom: 5px; font-weight: bold;">Nova senha:</label>
                    <input type="password" name="new_password1" autocomplete="new-password" required id="id_new_password1" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="id_new_password2" style="display: block; margin-bottom: 5px; font-weight: bold;">Confirme a nova senha:</label>
                    <input type="password" name="new_password2" autocomplete="new-password" required id="id_new_password2" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
                    Salvar Nova Senha
                </button>
            </form>
        {% else %}
            <p style="color: red; text-align: center;">Este link de recuperação é inválido ou já expirou.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
