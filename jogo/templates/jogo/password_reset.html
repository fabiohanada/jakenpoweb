{% extends 'jogo/base.html' %}
{% block content %}
    <div style="text-align: center;">
        <h2>Recuperar Senha</h2>
        <p>Digite o seu e-mail e enviaremos um link para redefinir a sua senha.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px;">Enviar E-mail</button>
        </form>
    </div>
{% endblock %}
